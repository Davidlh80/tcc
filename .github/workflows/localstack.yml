name: LocalStack Experiment

on:
  workflow_dispatch:

  push:
    branches:
      - "**"
    paths:
      - "terraform/**"
      - "scripts/run-localstack-tests.sh"
      - ".github/workflows/localstack.yml"

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:4566
  TF_IN_AUTOMATION: "true"

jobs:
  discover:
    name: Discover Terraform batches
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(toJson(github.event.commits), '#teste'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batches.outputs.matrix }}
      count: ${{ steps.batches.outputs.count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover scenarios and resources
        id: batches
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          valid_scenarios = {"manual", "ia-sem-contexto", "ia-com-contexto"}
          valid_resources = {"s3", "iam", "security-group"}
          batches = set()

          for terraform_file in Path("terraform").rglob("*.tf"):
              parts = terraform_file.parts
              if len(parts) < 4:
                  continue

              scenario = parts[1]
              resource = terraform_file.parent.name
              if scenario in valid_scenarios and resource in valid_resources:
                  batches.add((scenario, resource))

          include = [
              {"scenario": scenario, "resource": resource}
              for scenario, resource in sorted(batches)
          ]

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}\n")
              output.write(f"count={len(include)}\n")

          print("Lotes encontrados:")
          print(json.dumps(include, indent=2))
          PY

      - name: Require at least one Terraform batch
        if: steps.batches.outputs.count == '0'
        run: |
          echo "Nenhum template .tf foi encontrado na pasta terraform."
          exit 1

  localstack:
    name: ${{ matrix.scenario }} / ${{ matrix.resource }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    services:
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3,iam,ec2
          DEBUG: 0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install terraform-local
        run: python -m pip install --disable-pip-version-check terraform-local==0.24.1

      - name: Execute LocalStack batch
        id: execute
        shell: bash
        run: |
          bash scripts/run-localstack-tests.sh \
            --scenario "${{ matrix.scenario }}" \
            --resource "${{ matrix.resource }}" \
            --limit 0 \
            --report "resultados/localstack/${{ matrix.scenario }}-${{ matrix.resource }}.csv"

      - name: Upload LocalStack results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localstack-${{ matrix.scenario }}-${{ matrix.resource }}
          path: resultados/localstack/
          if-no-files-found: warn

      - name: Report template failures
        if: always() && steps.execute.outputs.failures != '' && steps.execute.outputs.failures != '0'
        run: |
          echo "::warning title=Falhas encontradas no lote::${{ steps.execute.outputs.failures }} de ${{ steps.execute.outputs.templates }} template(s) falharam em ${{ matrix.scenario }}/${{ matrix.resource }}."
