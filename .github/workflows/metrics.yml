name: Collect Metrics

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  collect-metrics:
    name: Collect PR Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run metrics collector
        shell: bash
        run: |
          if [ -f scripts/collect_pr_metrics.py ]; then
            python scripts/collect_pr_metrics.py
          else
            echo "Script de métricas ainda não implementado."
          fi
