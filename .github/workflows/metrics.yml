name: Collect Metrics

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/metrics.yml"

  push:
    branches:
      - main
      - "feature/**"
      - "manual/**"
      - "ia-sem-contexto/**"
      - "ia-com-contexto/**"
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/metrics.yml"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  collect-metrics:
    name: Collect Experiment Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect metrics
        run: go run ./scripts/collect-metrics

      - name: Generate metrics summary
        run: go run ./scripts/generate-summary

      - name: Upload metrics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-metrics
          path: |
            resultados/metrics/run-metrics.json
            resultados/metrics/run-metrics.csv
            resultados/metrics/template-inventory.csv
            resultados/metrics/template-summary.csv
          if-no-files-found: warn
