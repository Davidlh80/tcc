name: Collect Metrics

on:
  workflow_dispatch:
  pull_request:
    types: [opened, closed]

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run metrics collector when available
        run: |
          if [ -f scripts/collect_pr_metrics.py ]; then
            python scripts/collect_pr_metrics.py
          else
            echo "Coletor de métricas ainda não implementado."
          fi
