name: Terraform Validate

on:
  pull_request:
    branches:
      - main
      - "feature/**"
      - "manual/**"
      - "ia-sem-contexto/**"
      - "ia-com-contexto/**"
    paths:
      - "terraform/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
      - "feature/**"
      - "manual/**"
      - "ia-sem-contexto/**"
      - "ia-com-contexto/**"
    paths:
      - "terraform/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Find Terraform templates
        id: find_templates
        shell: bash
        run: |
          set -euo pipefail

          find terraform -type f -name "*.tf" -printf "%h\n" | sort -u > terraform_dirs.txt

          echo "Templates encontrados:"
          cat terraform_dirs.txt || true

          if [ ! -s terraform_dirs.txt ]; then
            echo "has_templates=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum arquivo .tf encontrado."
          else
            echo "has_templates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Terraform templates
        id: validate_templates
        if: steps.find_templates.outputs.has_templates == 'true'
        shell: bash
        run: |
          set -uo pipefail

          results_dir="resultados/terraform"
          logs_dir="$results_dir/logs"
          report="$results_dir/validation-results.csv"
          mkdir -p "$logs_dir"

          echo 'directory,fmt,init,validate,result' > "$report"
          failures=0

          while IFS= read -r dir; do
            echo "::group::Validando template em: $dir"

            safe_name=$(echo "$dir" | tr '/\\' '__')
            fmt_log="$logs_dir/${safe_name}-fmt.log"
            init_log="$logs_dir/${safe_name}-init.log"
            validate_log="$logs_dir/${safe_name}-validate.log"

            fmt_result=failed
            init_result=failed
            validate_result=skipped

            if terraform fmt -check "$dir" >"$fmt_log" 2>&1; then
              fmt_result=passed
            fi
            cat "$fmt_log"

            if terraform -chdir="$dir" init -backend=false -input=false -no-color >"$init_log" 2>&1; then
              init_result=passed
              if terraform -chdir="$dir" validate -no-color >"$validate_log" 2>&1; then
                validate_result=passed
              else
                validate_result=failed
              fi
            fi

            cat "$init_log"
            if [ -f "$validate_log" ]; then
              cat "$validate_log"
            fi

            if [ "$fmt_result" = passed ] && [ "$init_result" = passed ] && [ "$validate_result" = passed ]; then
              result=passed
            else
              result=failed
              failures=$((failures + 1))
            fi

            echo "$dir,$fmt_result,$init_result,$validate_result,$result" >> "$report"
            echo "Resultado: fmt=$fmt_result init=$init_result validate=$validate_result"
            echo "::endgroup::"
          done < terraform_dirs.txt

          cat "$report"
          echo "failure_count=$failures" >> "$GITHUB_OUTPUT"

          {
            echo "## Resultado da validação Terraform"
            echo
            echo "Templates avaliados: $(wc -l < terraform_dirs.txt)"
            echo "Templates com falha: $failures"
            echo
            echo '```csv'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-validation-results
          path: |
            terraform_dirs.txt
            resultados/terraform/validation-results.csv
            resultados/terraform/logs/
          if-no-files-found: warn

      - name: Report validation failures
        if: always() && steps.validate_templates.outputs.failure_count != '' && steps.validate_templates.outputs.failure_count != '0'
        run: |
          echo "${{ steps.validate_templates.outputs.failure_count }} template(s) apresentaram falha. Consulte o artefato terraform-validation-results."
          exit 1
